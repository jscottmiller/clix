name: Build CLIX Image

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Build on version tags

permissions:
  contents: write  # Required for creating releases

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Remove unnecessary tools to free space for the build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Build image with Docker
        run: ./scripts/docker-build.sh

      - name: Prepare artifact
        run: |
          mv result/clix.img clix-x86_64.img
          ls -lh clix-x86_64.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clix-x86_64
          path: clix-x86_64.img
          retention-days: 7

      # For tagged releases, create a GitHub release (without asset - too large)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Download

            The disk image is too large for GitHub release assets (3GB+).

            **[Download clix-x86_64.img.zip from Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**

            Or build it yourself:
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd clix
            ./scripts/docker-build.sh
            ```
