name: Build CLIX Image

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Build on version tags

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Remove unnecessary tools to free space for the build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Build image with Docker
        run: ./scripts/docker-build.sh

      - name: Compress image
        run: |
          zip clix-x86_64.img.zip result/clix.img
          ls -lh clix-x86_64.img.zip
          # Show uncompressed size for reference
          ls -lh result/clix.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clix-x86_64
          path: clix-x86_64.img.zip
          retention-days: 7
          compression-level: 0  # Already compressed

      # For tagged releases, also create a GitHub release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clix-x86_64.img.zip
          generate_release_notes: true
